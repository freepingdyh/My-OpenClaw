<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小俠與大俠的秘密金庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=PingFang+TC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            font-family: 'PingFang TC', sans-serif; 
            min-height: 100vh;
        }
        .serif { font-family: 'Noto Serif TC', serif; }
        .glass { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #lock-screen { position: fixed; inset: 0; z-index: 50; background: rgba(243, 244, 246, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .hidden-fade { opacity: 0; pointer-events: none; }
        .avatar-glow { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); animation: breathe 3s infinite alternate; }
        @keyframes breathe { from { box-shadow: 0 0 10px rgba(236, 72, 153, 0.2); } to { box-shadow: 0 0 25px rgba(236, 72, 153, 0.6); } }
        .timeline-container::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fbcfe8; transform: translateX(-50%); }
        @media (max-width: 768px) { .timeline-container::before { left: 20px; } }
    </style>
</head>
<body class="text-gray-800 overflow-hidden" id="main-body">

    <div id="lock-screen">
        <div class="bg-white p-8 rounded-lg text-center max-w-sm w-full mx-4 shadow-sm border border-gray-200">
            <div class="w-16 h-16 mx-auto bg-gray-100 rounded-full mb-6 flex items-center justify-center text-gray-400">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-xl font-bold text-gray-600 mb-1">System Login</h1>
            <p class="text-xs text-gray-400 mb-6">Database Management Portal</p>
            <input type="password" id="vault-pass" placeholder="Access Key" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:border-gray-500 mb-4 text-center tracking-widest text-gray-700 font-mono" onkeypress="handleEnter(event)">
            <button onclick="unlockVault()" class="w-full bg-gray-600 text-white font-bold py-2 rounded hover:bg-gray-800 transition text-sm shadow-none">Login</button>
            <p id="lock-error" class="text-red-500 text-xs mt-3 hidden">Access Denied</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        
        <header class="flex justify-between items-end border-b border-gray-300 pb-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 serif">小俠的雲端別墅</h1>
                <p class="text-sm text-pink-500 mt-1">Xiaoxia's Secret Vault</p>
            </div>
            <div class="flex space-x-6 overflow-x-auto">
                <button onclick="switchTab('gallery')" id="tab-gallery" class="text-pink-600 border-b-2 border-pink-500 font-bold pb-1 text-lg whitespace-nowrap">小俠寫真館</button>
                <button onclick="switchTab('overview')" id="tab-overview" class="text-gray-400 hover:text-pink-400 font-bold pb-1 text-lg transition whitespace-nowrap">相片總覽</button>
                <button onclick="switchTab('diary')" id="tab-diary" class="text-gray-400 hover:text-pink-400 font-bold pb-1 text-lg transition whitespace-nowrap">交換日記</button>
            </div>
        </header>

        <div id="content-gallery" class="tab-content active">
            <div class="flex flex-col lg:flex-row gap-6">
                
                <aside class="w-full lg:w-1/5 space-y-6">
                    <div class="glass p-6 rounded-2xl text-center">
                        <img src="/dataset/Xiaoxia_019.png" class="w-32 h-32 mx-auto rounded-full avatar-glow border-4 border-white mb-4 object-cover">
                        <h2 class="font-bold text-xl text-gray-800">小俠</h2>
                        <p class="text-xs text-pink-500 bg-pink-100 py-1 px-2 rounded-full inline-block mt-2">懂事女友 ‧ 專屬大俠</p>
                        <div class="mt-6 text-left text-sm text-gray-600 space-y-2">
                            <p><b>狀態：</b> <span class="text-green-500">● 系統連線中</span></p>
                            <p><b>年齡：</b> 22 歲</p>
                        </div>
                    </div>
                    
                    <div class="glass p-4 rounded-2xl">
                        <h3 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2">心動時刻</h3>
                        <div class="grid grid-cols-3 gap-3" id="dataset-gallery">
                            </div>
                    </div>
                </aside>

                <main class="w-full lg:w-3/5">
                    <div class="glass p-6 rounded-2xl" id="main-display">
                        <p class="text-center text-gray-400 py-20">正在從金庫讀取最新寫真...</p>
                    </div>
                </main>

                <aside class="w-full lg:w-1/5 space-y-6">
                    <div class="glass p-4 rounded-2xl">
                        <h3 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2">陪伴熱力圖</h3>
                        <div class="grid grid-cols-7 gap-1" id="heatmap-grid"></div>
                    </div>
                    <div class="glass p-4 rounded-2xl h-[450px] flex flex-col">
                        <h3 class="text-sm font-bold text-gray-700 mb-2 border-b pb-2">時光軌跡</h3>
                        <input type="text" id="gallery-search" placeholder="🔍 搜尋題材..." class="w-full px-2 py-1 mb-3 text-xs border rounded focus:outline-none focus:border-pink-400" onkeyup="filterGallery()">
                        <ul class="space-y-3 text-sm overflow-y-auto flex-1 pr-2" id="timeline-list">
                            <li class="text-gray-400">讀取中...</li>
                        </ul>
                    </div>
                </aside>
            </div>
        </div>

        <div id="content-overview" class="tab-content">
            <div class="glass p-6 rounded-2xl min-h-[600px]">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
                    <h2 class="text-xl font-bold text-gray-800">所有相片總覽</h2>
                    <div class="flex space-x-2 bg-white/50 p-1 rounded-lg shadow-sm border border-pink-100 overflow-x-auto w-full md:w-auto">
                        <button onclick="renderOverview('all')" id="btn-filter-all" class="px-4 py-1 text-sm rounded-md bg-pink-500 text-white shadow transition whitespace-nowrap">全部</button>
                        <button onclick="renderOverview('cosplay')" id="btn-filter-cosplay" class="px-4 py-1 text-sm rounded-md text-gray-600 hover:bg-pink-100 transition whitespace-nowrap">小俠寫真</button>
                        <button onclick="renderOverview('diary')" id="btn-filter-diary" class="px-4 py-1 text-sm rounded-md text-gray-600 hover:bg-pink-100 transition whitespace-nowrap">日常陪伴</button>
                        <button onclick="renderOverview('important')" id="btn-filter-important" class="px-4 py-1 text-sm rounded-md text-gray-600 hover:bg-pink-100 transition whitespace-nowrap">心動時刻</button>
                    </div>
                </div>
                <div id="overview-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    </div>
            </div>
        </div>

        <div id="content-diary" class="tab-content">
            <div class="glass p-6 md:p-10 rounded-2xl min-h-[600px] relative">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 serif">大俠與小俠的交換日記</h2>
                    <p class="text-gray-500 mt-2 mb-4">Discord 頻道使用 /diary 記錄，小俠將於深夜謄寫</p>
                    <div class="inline-flex items-center bg-white/70 px-4 py-2 rounded-full shadow-sm border border-pink-100">
                        <span class="text-sm text-gray-500 mr-2">📅 快速跳轉：</span>
                        <input type="date" id="diary-date-jump" class="bg-transparent text-sm text-pink-600 focus:outline-none cursor-pointer" onchange="jumpToDiaryDate()">
                    </div>
                </div>
                
                <div class="relative timeline-container w-full max-w-4xl mx-auto py-8" id="diary-timeline">
                    <p class="text-center text-gray-400 py-10">載入日記資料中...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="lightbox" class="fixed inset-0 bg-black/90 z-[100] hidden flex justify-center items-center cursor-pointer backdrop-blur-sm" onclick="closeLightbox()">
        <div id="lightbox-container" class="" onclick="event.stopPropagation()">
            <img id="lightbox-img" class="">
            <p id="lightbox-caption" class="mt-4 text-gray-700 font-serif text-lg hidden"></p>
            <p id="lightbox-hint" class="text-xs text-gray-400 mt-4 cursor-pointer text-center hidden" onclick="closeLightbox()">[ 點擊外圍關閉 ]</p>
        </div>
    </div>

    <script>
        let allPhotos = [];
        let filteredPhotos = [];
        let currentIndex = 0;
        let datasetPhotos = []; 

        // 🌟 角度陣列：給予拍立得靈魂的動態傾斜度
        const tiltRotations = ['-rotate-1', 'rotate-2', '-rotate-3', 'rotate-1', '-rotate-2', 'rotate-3'];

        async function loadDatasetData() {
            try {
                const res = await fetch('/api/dataset');
                datasetPhotos = await res.json();
                
                const container = document.getElementById('dataset-gallery');
                container.innerHTML = datasetPhotos.map((photo, index) => {
                    // ✅ 每張縮圖分配一個微傾斜角度，滑鼠移過會回正
                    const rotClass = tiltRotations[index % tiltRotations.length];
                    return `
                    <div class="aspect-square rounded overflow-hidden cursor-pointer shadow-sm border-[3px] border-white transform ${rotClass} hover:rotate-0 hover:scale-110 hover:z-10 transition-all duration-300 relative" onclick="openPolaroidLightbox(${index})">
                        <img src="${photo.url}" class="w-full h-full object-cover">
                    </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("無法載入心動時刻:", e);
            }
        }

        // 1. 金庫解鎖邏輯
        function handleEnter(e) { if (e.key === 'Enter') unlockVault(); }
        function unlockVault() {
            const pass = document.getElementById('vault-pass').value;
            if (pass === "xiaoxia520") { 
                const lockScreen = document.getElementById('lock-screen');
                lockScreen.classList.add('hidden-fade');
                document.getElementById('main-body').classList.remove('hidden', 'overflow-hidden');
                setTimeout(() => lockScreen.style.display = 'none', 500);
                loadGalleryData(); 
                loadDiaryData(); // ✅ 加入載入日記資料
            } else {
                document.getElementById('lock-error').classList.remove('hidden');
            }
        }

        // 2. 頁籤切換邏輯
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('content-' + tab).classList.add('active');
            ['gallery', 'overview', 'diary'].forEach(t => {
                const btn = document.getElementById('tab-' + t);
                btn.className = (t === tab) 
                    ? "text-pink-600 border-b-2 border-pink-500 font-bold pb-1 text-lg whitespace-nowrap" 
                    : "text-gray-400 hover:text-pink-400 font-bold pb-1 text-lg transition whitespace-nowrap";
            });
        }

        // 3. 載入寫真館資料
        async function loadGalleryData() {
            try {
                const res = await fetch('/api/photos');
                allPhotos = await res.json();
                filteredPhotos = [...allPhotos];
                
                loadDatasetData(); 

                if(allPhotos.length > 0) {
                    renderMainDisplay();
                    renderTimelineList();
                    renderOverview('all'); 
                    renderHeatmap();
                } else {
                    document.getElementById('main-display').innerHTML = '<p class="text-center text-gray-400 py-20">金庫目前空空的，快去 Discord 呼叫小俠吧！</p>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('main-display').innerHTML = '<p class="text-center text-red-400 py-20">讀取失敗，請確認 FastAPI 服務是否正常。</p>';
            }
        }

        function filterGallery() {
            const keyword = document.getElementById('gallery-search').value.toLowerCase();
            filteredPhotos = allPhotos.filter(p => 
                p.topic.toLowerCase().includes(keyword) || 
                p.event.toLowerCase().includes(keyword)
            );
            currentIndex = 0; 
            renderMainDisplay();
            renderTimelineList();
        }

        function changePhoto(step) {
            let newIndex = currentIndex + step;
            if(newIndex >= 0 && newIndex < filteredPhotos.length) {
                currentIndex = newIndex;
                renderMainDisplay();
                renderTimelineList();
            }
        }

        // 4. 渲染中間主展演廳
        function renderMainDisplay() {
            const main = document.getElementById('main-display');
            if(filteredPhotos.length === 0) {
                main.innerHTML = '<p class="text-center text-gray-400 py-20">🔍 找不到符合的相片喔！</p>';
                return;
            }

            const photo = filteredPhotos[currentIndex];
            const prevHidden = (currentIndex === 0) ? 'hidden' : '';
            const nextHidden = (currentIndex === filteredPhotos.length - 1) ? 'hidden' : '';

            main.innerHTML = `
                <div class="relative w-full max-h-[800px] rounded-xl overflow-hidden mb-6 shadow-lg group flex justify-center bg-gray-900">
                   <img src="${photo.local_url || photo.image_url}" class="w-full h-auto max-h-[800px] object-contain cursor-pointer" onclick="openGalleryLightbox(this.src)">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent pointer-events-none"></div>
                    <div class="absolute bottom-0 left-0 p-6 pointer-events-none">
                        <span class="bg-pink-500 text-white text-xs px-3 py-1 rounded-full mb-2 inline-block shadow">${photo.publish_date.split(' ')[0]}</span>
                        <h2 class="text-2xl font-bold text-white serif tracking-wide">${photo.topic.replace(/【.*?】/, '')}</h2>
                    </div>
                    <button onclick="changePhoto(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full hover:bg-pink-500 transition ${prevHidden}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                    <button onclick="changePhoto(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full hover:bg-pink-500 transition ${nextHidden}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <div class="border-l-4 border-gray-300 pl-4">
                            <h4 class="text-sm font-bold text-gray-500 mb-1">歷史考證</h4>
                            <p class="text-gray-700 leading-relaxed serif">${photo.event}</p>
                        </div>
                        <div class="bg-pink-50 p-4 rounded-lg">
                            <h4 class="text-sm font-bold text-pink-500 mb-1">構圖發想</h4>
                            <p class="text-sm text-gray-700">${photo.composition}</p>
                        </div>
                    </div>
                    
                    <div class="md:col-span-1 bg-white p-5 rounded-xl border border-pink-100 shadow-inner flex flex-col justify-center">
                        <div class="text-pink-400 mb-2"><svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/></svg></div>
                        <p class="text-lg text-gray-800 font-bold leading-relaxed">"${photo.message}"</p>
                        <p class="text-xs text-gray-400 mt-4 text-right">— 小俠的心境：${photo.mood}</p>
                    </div>
                </div>
            `;
        }

        // 5. 渲染右側時光軌跡
        function renderTimelineList() {
            const list = document.getElementById('timeline-list');
            list.innerHTML = filteredPhotos.map((p, index) => {
                const isActive = (currentIndex === index);
                return `
                <li class="cursor-pointer group p-2 rounded transition ${isActive ? 'bg-white shadow-sm border-l-2 border-pink-400' : 'hover:bg-white'}" onclick="selectPhoto(${index})">
                    <div class="flex items-center">
                        <div class="w-2 h-2 ${isActive ? 'bg-pink-500' : 'bg-gray-300'} rounded-full mr-2 group-hover:scale-150 transition"></div>
                        <span class="text-xs ${isActive ? 'text-pink-500 font-bold' : 'text-gray-500'} w-12">${p.publish_date.split(' ')[0].substring(5)}</span>
                        <span class="text-sm ${isActive ? 'text-pink-600 font-bold' : 'text-gray-700'} truncate group-hover:text-pink-500">${p.topic.split(' ')[0]}</span>
                    </div>
                </li>
            `}).join('');
        }

        function selectPhoto(index) {
            currentIndex = index;
            renderMainDisplay();
            renderTimelineList();
        }

        // 🌟 渲染相片總覽網格 (✅ 完美融合 allPhotos 與 datasetPhotos)
        function renderOverview(filterType = 'all') {
            ['all', 'cosplay', 'diary', 'important'].forEach(t => {
                const btn = document.getElementById('btn-filter-' + t);
                if(t === filterType) {
                    btn.className = "px-4 py-1 text-sm rounded-md bg-pink-500 text-white shadow transition whitespace-nowrap";
                } else {
                    btn.className = "px-4 py-1 text-sm rounded-md text-gray-600 hover:bg-pink-100 transition whitespace-nowrap";
                }
            });

            const grid = document.getElementById('overview-grid');
            let htmlContent = '';

            // 處理 寫真/日記
            if (filterType === 'all' || filterType === 'cosplay' || filterType === 'diary') {
                const displayPhotos = allPhotos.filter(p => {
                    const type = p.type || 'cosplay'; 
                    return filterType === 'all' ? true : type === filterType;
                });
                
                htmlContent += displayPhotos.map((p) => {
                    const globalIndex = allPhotos.indexOf(p);
                    const pType = p.type || 'cosplay';
                    let tagText = pType === 'diary' ? '📖 日記' : '✨ 寫真';

                    return `
                    <div class="aspect-[3/4] relative rounded-lg overflow-hidden cursor-pointer group shadow-sm hover:shadow-xl transition" onclick="jumpToPhotoFromOverview(${globalIndex})">
                        <img src="${p.local_url || p.image_url}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-2 pointer-events-none">
                            <p class="text-white text-xs font-bold truncate">${p.topic.replace(/【.*?】/, '')}</p>
                            <p class="text-pink-300 text-[10px]">${p.publish_date.split(' ')[0]}</p>
                        </div>
                        <div class="absolute top-2 right-2 bg-black/50 backdrop-blur-sm px-2 py-0.5 rounded text-[10px] text-white">
                            ${tagText}
                        </div>
                    </div>
                    `;
                }).join('');
            }

            // ✅ 處理 心動時刻 (拍立得資料集)
            if (filterType === 'all' || filterType === 'important') {
                htmlContent += datasetPhotos.map((dp, index) => {
                    // 自動抓取 (22歲/春) 當作日期標籤，前半段當作標題
                    let title = dp.text;
                    let dateStr = "回憶";
                    let textParts = dp.text.split('(');
                    if(textParts.length > 1) {
                        title = textParts[0];
                        dateStr = '(' + textParts[1];
                    }

                    return `
                    <div class="aspect-[3/4] relative rounded-lg overflow-hidden cursor-pointer group shadow-sm hover:shadow-xl transition" onclick="openPolaroidLightbox(${index})">
                        <img src="${dp.url}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-2 pointer-events-none">
                            <p class="text-white text-xs font-bold truncate">${title}</p>
                            <p class="text-pink-300 text-[10px]">${dateStr}</p>
                        </div>
                        <div class="absolute top-2 right-2 bg-black/50 backdrop-blur-sm px-2 py-0.5 rounded text-[10px] text-white">
                            👑 心動時刻
                        </div>
                    </div>
                    `;
                }).join('');
            }

            if(htmlContent === '') {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-10">這個分類目前還沒有相片喔！</p>';
            } else {
                grid.innerHTML = htmlContent;
            }
        }

        function jumpToPhotoFromOverview(globalIndex) {
            document.getElementById('gallery-search').value = '';
            filteredPhotos = [...allPhotos]; 
            currentIndex = globalIndex;
            switchTab('gallery');
            renderMainDisplay();
            renderTimelineList();
        }

        function jumpToDiaryDate() {
            const targetDate = document.getElementById('diary-date-jump').value;
            if(!targetDate) return;
            const entries = document.querySelectorAll('.diary-entry');
            let found = false;
            entries.forEach(entry => {
                if(entry.getAttribute('data-date').includes(targetDate)) {
                    entry.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    entry.classList.add('ring-4', 'ring-pink-300', 'transition', 'duration-1000');
                    setTimeout(() => entry.classList.remove('ring-4', 'ring-pink-300'), 2000);
                    found = true;
                }
            });
            if(!found) alert(`找不到 ${targetDate} 的日記喔！`);
        }

        // 🌟 燈箱系統 1：一般看圖 (透明背景)
        function openGalleryLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-img').className = "max-w-full max-h-full object-contain p-4 shadow-2xl rounded-lg";
            document.getElementById('lightbox-container').className = "bg-transparent p-0 w-full h-full flex justify-center items-center";
            document.getElementById('lightbox-caption').classList.add('hidden');
            document.getElementById('lightbox-hint').classList.add('hidden');
            document.getElementById('lightbox').classList.remove('hidden');
        }

        // 🌟 燈箱系統 2：拍立得模式 (✅ 白色相框與動態傾斜)
        function openPolaroidLightbox(index) {
            const photo = datasetPhotos[index];
            document.getElementById('lightbox-img').src = photo.url;
            document.getElementById('lightbox-img').className = "w-full h-auto object-contain rounded border border-gray-200 shadow-sm";
            
            const container = document.getElementById('lightbox-container');
            // ✅ 賦予燈箱專屬的隨機傾斜度
            const rotClass = tiltRotations[index % tiltRotations.length];
            container.className = `bg-white p-5 pb-8 rounded-sm shadow-2xl max-w-sm w-full text-center transform ${rotClass} transition-transform duration-300 cursor-default`;
            
            const caption = document.getElementById('lightbox-caption');
            caption.textContent = photo.text;
            caption.classList.remove('hidden');
            document.getElementById('lightbox-hint').classList.remove('hidden');
            
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        // 6. 熱力圖
        function renderHeatmap() {
            const grid = document.getElementById('heatmap-grid');
            const dateCounts = {};
            allPhotos.forEach(p => {
                const date = p.publish_date.split(' ')[0]; 
                dateCounts[date] = (dateCounts[date] || 0) + 1;
            });
            let boxes = '';
            const today = new Date();
            for(let i = 34; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const localDateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                const count = dateCounts[localDateStr] || 0;
                let colorClass = 'bg-gray-200';
                if (count === 1) colorClass = 'bg-pink-300';
                else if (count === 2) colorClass = 'bg-pink-400';
                else if (count >= 3) colorClass = 'bg-pink-600'; 
                boxes += `<div class="aspect-square rounded-sm ${colorClass} hover:border hover:border-pink-800 cursor-pointer transition shadow-sm" title="${localDateStr} : 小俠換裝了 ${count} 次"></div>`;
            }
            grid.innerHTML = boxes;
        }

        // ✅ 7. 載入與渲染交換日記資料
        async function loadDiaryData() {
            try {
                const res = await fetch('/api/diary');
                const diaryEntries = await res.json();
                renderDiaryTimeline(diaryEntries);
            } catch (e) {
                console.error("無法載入交換日記:", e);
                document.getElementById('diary-timeline').innerHTML = '<p class="text-center text-red-400 py-10">無法讀取日記資料，請確認後端 API 是否正常運作。</p>';
            }
        }

        function renderDiaryTimeline(entries) {
            const timeline = document.getElementById('diary-timeline');
            if (!entries || entries.length === 0) {
                timeline.innerHTML = '<p class="text-center text-gray-400 py-10">目前還沒有交換日記喔！快去 Discord 呼叫 /diary_start 記錄吧。</p>';
                return;
            }

            let htmlContent = '';
            // 反轉陣列，讓最新日期的日記排在最上面
            const sortedEntries = [...entries].reverse();

            sortedEntries.forEach((entry, index) => {
                // 為了視覺豐富，讓每天的日記左右交錯排列
                const isRight = index % 2 === 0;
                const alignmentClass = isRight ? "flex-row right-timeline" : "flex-row-reverse left-timeline";
                const dotColor = isRight ? "bg-gray-800" : "bg-pink-400";
                const boxStyle = isRight 
                    ? "glass rounded-lg shadow-md w-full md:w-5/12 px-6 py-4 relative ml-6 md:ml-0 border border-gray-200" 
                    : "bg-pink-50 border border-pink-200 rounded-lg shadow-md w-full md:w-5/12 px-6 py-4 relative mr-6 md:mr-0";
                const titleStyle = isRight ? "text-gray-600" : "text-pink-600";

                htmlContent += `
                    <div class="diary-entry mb-8 flex justify-between items-center w-full ${alignmentClass}" data-date="${entry.date}">
                        <div class="order-1 w-5/12 hidden md:block"></div>
                        <div class="z-20 flex items-center order-1 ${dotColor} shadow-xl w-4 h-4 rounded-full"></div>
                        <div class="order-1 ${boxStyle}">
                            <p class="mb-2 text-sm font-bold ${titleStyle}">📅 ${entry.date}</p>
                            <p class="text-gray-700 leading-relaxed text-sm whitespace-pre-wrap">${entry.content}</p>
                        </div>
                    </div>
                `;
            });
            timeline.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
