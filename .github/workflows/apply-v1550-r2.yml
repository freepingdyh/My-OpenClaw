name: Apply v1.5.50 corrected

on:
  push:
    paths:
      - '.github/workflows/apply-v1550-r2.yml'

permissions:
  contents: write

jobs:
  apply-v1550:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v1550.patch
          git apply --check /tmp/v1550.patch
          git apply /tmp/v1550.patch
          python -m py_compile lobster_discord.py
      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lobster_discord.py
          git commit -m "v1.5.50"
          git push
