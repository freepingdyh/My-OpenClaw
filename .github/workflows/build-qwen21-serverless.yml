name: Build Qwen21 Serverless Image

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/v1.12.05-scene-direct-contract
    paths:
      - "xiaoxia/serverless/**"
      - ".github/workflows/build-qwen21-serverless.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/freepingdyh/my-openclaw-qwen21

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Qwen21 worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./xiaoxia/serverless/Dockerfile.qwen21
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:qwen21
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
