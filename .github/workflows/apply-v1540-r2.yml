name: Apply v1.5.40_R2 patch

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.5.40_R2-male-distance
    paths:
      - patches/v1.5.40_R2.patch
      - .github/workflows/apply-v1540-r2.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.5.40_R2-male-distance
          fetch-depth: 0

      - name: Apply male-distance patch
        run: |
          git apply --check patches/v1.5.40_R2.patch
          git apply patches/v1.5.40_R2.patch
          python -m py_compile lobster_discord.py

      - name: Remove one-time patch files
        run: |
          rm -f patches/v1.5.40_R2.patch
          rm -f .github/workflows/apply-v1540-r2.yml
          rmdir patches 2>/dev/null || true

      - name: Commit updated source
        run: |
          git config user.name "ChatGPT GitHub Automation"
          git config user.email "actions@github.com"
          git add lobster_discord.py patches .github/workflows/apply-v1540-r2.yml
          git commit -m "v1.5.40_R2: keep men far from Xiaoxia"
          git push origin HEAD:feature/v1.5.40_R2-male-distance
