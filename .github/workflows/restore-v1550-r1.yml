name: Restore v1.5.50_R1

on:
  push:
    paths:
      - '.github/workflows/restore-v1550-r1.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch lobster_discord.py
        shell: bash
        run: |
          git checkout d14db9e9304aa53e0bb4975d86db8eca720e2392 -- lobster_discord.py
          python - <<'PY'
          from pathlib import Path
          p = Path('lobster_discord.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('LOBSTER_VERSION = "1.5.50"', 'LOBSTER_VERSION = "1.5.50_R1"', 1)
          text = text.replace('SEEDREAM_WARDROBE_ENABLE_SAFETY_CHECKER = _env_bool("SEEDREAM_WARDROBE_ENABLE_SAFETY_CHECKER", True)', 'SEEDREAM_WARDROBE_ENABLE_SAFETY_CHECKER = _env_bool("SEEDREAM_WARDROBE_ENABLE_SAFETY_CHECKER", False)', 1)
          text = text.replace('async def generate_seedream_v45_repair(original_image_path, repair_request, enable_safety_checker=True, trace_context=None, source_context=None):', 'async def generate_seedream_v45_repair(original_image_path, repair_request, enable_safety_checker=False, trace_context=None, source_context=None):', 1)
          text = text.replace('generated_image_url = await generate_seedream_v45_repair(source_path, repair_request, enable_safety_checker=True, trace_context=trace_context, source_context=context)', 'generated_image_url = await generate_seedream_v45_repair(source_path, repair_request, enable_safety_checker=False, trace_context=trace_context, source_context=context)', 1)
          text = text.replace('enable_safety_checker=True,\n                current_outfit=current_outfit,', 'enable_safety_checker=False,\n                current_outfit=current_outfit,', 1)
          text = text.replace('# 衣櫃去人化仍保留獨立開關，預設 true；若之後要連去人化也關，可設 SEEDREAM_WARDROBE_ENABLE_SAFETY_CHECKER=false。', '# 衣櫃去人化同樣預設關閉 safety checker。', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile lobster_discord.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lobster_discord.py
          git commit -m 'v1.5.50_R1: disable all Seedream safety checkers'
          git push
